name: backend — test, build, deploy

# Backend image is built here and pushed to GHCR; then the signed Komodo webhook
# redeploys the `oratge-backend` stack (dettinjo/homelab: stacks/home/oratge-backend).
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt pytest
      - run: cd backend && python -m pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/dettinjo/oratge-backend:latest
            ghcr.io/dettinjo/oratge-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Komodo (signed webhook → pull + redeploy stack "oratge-backend")
        env:
          SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          body=$(printf '{"ref":"refs/heads/main","after":"%s","repository":{"full_name":"%s"}}' "$GITHUB_SHA" "$GITHUB_REPOSITORY")
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')"
          code=$(curl -s -o /tmp/resp -w '%{http_code}' --max-time 30 -X POST \
            "https://hooks.joeldettinger.de/listener/github/stack/oratge-backend/deploy" \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: $sig" --data "$body")
          cat /tmp/resp; echo; echo "HTTP $code"
          [ "$code" -lt 300 ]
